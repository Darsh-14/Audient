<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audient</title>
<meta name="description" content="An interruptible real-time voice agent for Samsung PRISM Theme 05.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%232f7bff' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%23cfe3ff' stroke-width='1.2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Exo+2:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- background: a faint hex texture -->
<div class="hud" aria-hidden="true">
  <i class="hex hex-l"></i><i class="hex hex-r"></i>
</div>

<!-- sidebar: Tasks opens a panel listing every tool call -->
<nav class="rail" aria-label="Sidebar">
  <button id="tasksToggle" class="rail-btn" type="button" aria-expanded="false" aria-controls="tasksPanel">
    <span data-icon="tasks"></span><span class="rail-label">Tasks</span><span id="tasksBadge" class="badge" hidden>0</span>
  </button>
</nav>
<aside id="tasksPanel" class="drawer" aria-labelledby="tasksTitle">
  <div class="drawer-head">
    <h2 id="tasksTitle" class="readout-title">Tasks</h2>
    <button id="tasksClose" class="ic-btn" type="button" aria-label="Close tasks"><span data-icon="close"></span></button>
  </div>
  <ul id="tasks" class="tasks">
    <li class="tasks-empty">No tasks yet</li>
  </ul>
</aside>

<header class="top">
  <div class="brand">
    <h1 class="wordmark">AU<span>DIENT</span></h1>
    <p class="tagline">Interruptible AI Voice Agent</p>
  </div>
  <div class="top-right">
    <span id="clock" class="clock"></span>
  </div>
</header>

<main class="stage">
  <div class="side-spacer" aria-hidden="true"></div>

  <!-- the agent -->
  <section class="core">
    <div id="creature" class="creature" data-state="connecting" title="Touch it"></div>
  </section>

  <!-- right readout: things to try -->
  <aside class="readout right" aria-labelledby="demosTitle">
    <h2 id="demosTitle" class="readout-title">Try saying</h2>
    <div id="demos" class="demo-list"></div>
  </aside>

</main>

<section class="dialogue" aria-live="polite">
  <p id="lineAgent" class="line agent"><span class="who">Agent:</span><span id="lineAgentText">Loading…</span></p>
  <p id="lineUser" class="line user" hidden><span class="who">User:</span><span id="lineUserText"></span></p>
</section>

<div class="actions">
  <button id="interruptBtn" class="interrupt" type="button" aria-pressed="false"><span id="interruptLabel">Tap to talk</span><span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></button>

  <div class="input-row">
    <form id="composer" class="composer" autocomplete="off">
      <button type="button" id="attachBtn" class="ic-btn" aria-label="Show a camera frame or send a voice clip" aria-expanded="false"><span data-icon="plus"></span></button>
      <input id="sayInput" placeholder="Type a message" aria-label="Message">
      <button type="submit" class="ic-btn send" aria-label="Send"><span data-icon="send"></span></button>
    </form>
    <div id="attachMenu" class="menu" hidden>
      <p class="menu-title">Show the agent a camera frame</p>
      <div id="frameGrid" class="frame-grid"></div>
      <div class="menu-actions">
        <label class="menu-btn"><span data-icon="image"></span>Upload image<input id="imageFile" type="file" accept="image/*" hidden></label>
        <label class="menu-btn"><span data-icon="music"></span>Upload voice clip<input id="audioFile" type="file" accept="audio/*" hidden></label>
      </div>
    </div>
  </div>

  <p id="hint" class="hint"></p>
</div>

<div id="loader" class="loader" role="status">
  <div class="loader-card">
    <div class="loader-ring" aria-hidden="true"></div>
    <b>Waking up Audient</b>
    <p id="loaderText">Loading…</p>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
